name: Release AdBlock Browser (Windows Setup & macOS DMG)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust-browser
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cmd /c scripts\build_windows.bat
      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $ver = ("${{ github.event.inputs.tag || github.ref_name }}").TrimStart('v')
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc -and (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$ver" "installer\windows\AdBlockBrowser.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: rust-browser/dist/installer/*.exe

  build-macos-release:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust-browser
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: bash scripts/build_macos.sh
      - name: Build Styled macOS DMG
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VER="${{ github.event.inputs.tag }}"
            VER="${VER#v}"
          fi
          bash scripts/build_dmg.sh "$VER"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: rust-browser/dist/*.dmg

  publish-release:
    needs: [build-windows-release, build-macos-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AdBlock Tarayıcı ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/release-windows/*.exe
            artifacts/release-macos/*.dmg
