name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable with PyInstaller
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --icon "rust-browser\assets\app.ico" `
            --name "AdBlockTarayici" `
            --hidden-import PyQt6.QtWebEngineCore `
            --hidden-import PyQt6.QtWebEngineWidgets `
            --hidden-import PyQt6.QtWebChannel `
            --hidden-import PyQt6.QtSvg `
            main.py

      - name: Build Windows Installer (Inno Setup 6)
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc -and (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "installer\windows\AdBlockTarayici.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows build as ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\AdBlockTarayici\* -DestinationPath AdBlockTarayici-Windows-x64.zip

      - name: Upload Windows Setup Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdBlockTarayici-Windows-Setup
          path: dist/installer/AdBlockTarayici-Setup-0.1.0-x64.exe

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdBlockTarayici-Windows-x64
          path: AdBlockTarayici-Windows-x64.zip
